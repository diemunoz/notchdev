name: Idea
description: Suggest a feature or an improvement.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What do you do today, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would it work in the notch or the panel?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional — similar apps, screenshots, mockups.
